name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android 16 SDK, NDK & Accept Licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Native LatinIME Library (ndk-build)
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)}}"
          if [ -n "$NDK_DIR" ] && [ -f "$NDK_DIR/ndk-build" ]; then
            echo "Compiling libjni_latinime.so using NDK at $NDK_DIR for ARMv7 and ARMv8..."
            $NDK_DIR/ndk-build -C app/src/main/jni NDK_APPLICATION_MK=Application.mk NDK_LIBS_OUT=$GITHUB_WORKSPACE/app/src/main/jniLibs APP_ABI="armeabi-v7a arm64-v8a"
          elif command -v ndk-build &> /dev/null; then
            echo "Compiling libjni_latinime.so using ndk-build in PATH..."
            ndk-build -C app/src/main/jni NDK_APPLICATION_MK=Application.mk NDK_LIBS_OUT=$GITHUB_WORKSPACE/app/src/main/jniLibs APP_ABI="armeabi-v7a arm64-v8a"
          else
            echo "NDK not present in environment; skipping native pre-build"
          fi

      - name: Build Native Whisper Library (arm64-v8a & armeabi-v7a)
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)}}"
          if [ -n "$NDK_DIR" ] && [ -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
            echo "Compiling libwhisper.so using CMake and NDK at $NDK_DIR for ARMv7 and ARMv8..."
            for ABI in armeabi-v7a arm64-v8a; do
              mkdir -p app/src/main/jniLibs/$ABI
              cmake -B /tmp/build-whisper-$ABI \
                -S app/src/main/jni/whisper \
                -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=$ABI \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build-whisper-$ABI --config Release
              if [ -f "/tmp/build-whisper-$ABI/libwhisper.so" ]; then
                cp /tmp/build-whisper-$ABI/libwhisper.so app/src/main/jniLibs/$ABI/
                echo "Built and copied libwhisper.so for $ABI"
              fi
            done
          fi

          echo "Verifying native libraries in jniLibs:"
          find app/src/main/jniLibs -name "*.so" || echo "No .so found"

      - name: Bundle Offline Whisper GGML Model (tiny.en-q5_1)
        run: |
          mkdir -p app/src/main/assets/voice_models
          if [ ! -f "app/src/main/assets/voice_models/model.bin" ]; then
            echo "Downloading quantized Whisper model for offline speech-to-text..."
            curl -sL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin" -o app/src/main/assets/voice_models/model.bin || true
          fi
          if [ -f "app/src/main/assets/voice_models/model.bin" ]; then
            echo "Bundled offline model verified: $(ls -lh app/src/main/assets/voice_models/model.bin)"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign Release APK (Optional if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "Release signing secrets not configured. Skipping release APK build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks
          export KEYSTORE_PATH="/tmp/release-keystore.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f /tmp/release-keystore.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VianBoard-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VianBoard-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
